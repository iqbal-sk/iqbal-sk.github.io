name: Build and Deploy (Pages + Substack)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC (refresh Substack)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (prebuild fetches Substack + Pulse)
        run: npm run build
        env:
          SUBSTACK_FEED_URL: ${{ vars.SUBSTACK_FEED_URL }}
          PULSE_GITHUB_USERNAME: ${{ vars.PULSE_GITHUB_USERNAME || github.repository_owner }}
          PULSE_GITHUB_TOKEN: ${{ secrets.PULSE_GITHUB_TOKEN }}

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run deploy

