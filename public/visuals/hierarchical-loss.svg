<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Hierarchical loss: base BCE plus parent-child consistency penalty">
  <defs>
    <style>
      .box { fill: #0b0f19; fill-opacity: 0.7; stroke: #3a465a; stroke-width: 1.5; rx: 10; }
      .light { fill: #0b0f19; fill-opacity: 0.4; stroke: #3a465a; stroke-width: 1.5; rx: 10; }
      .muted { fill: #141a24; stroke: #2a3342; stroke-width: 1; rx: 10; }
      .accent { fill: #2563eb; fill-opacity: 0.9; }
      .accent2 { fill: #10b981; fill-opacity: 0.9; }
      .text { font: 500 13px/1.3 Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #c9d3e7; }
      .sub  { font: 12px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #91a1bd; }
      .title{ font: 600 16px/1.3 Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #e6edff; }
      .arrow{ stroke: #3a465a; stroke-width: 1.6; marker-end: url(#arrowhead); fill: none; }
      .small{ font: 11px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #9fb0cd; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3.5, 0 7" fill="#3a465a" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="20" y="30" class="title">Hierarchical Loss: base BCE + parent→child consistency (depth‑weighted)</text>

  <!-- Encoders row -->
  <rect class="box" x="40" y="70" width="240" height="80"/>
  <text x="60" y="105" class="text">Multilingual Text Encoder</text>
  <text x="60" y="126" class="sub">(e.g., XLM‑R)</text>

  <rect class="box" x="320" y="70" width="240" height="80"/>
  <text x="340" y="105" class="text">Vision Backbone</text>
  <text x="340" y="126" class="sub">(e.g., ViT/CLIP‑ViT)</text>

  <line class="arrow" x1="280" y1="110" x2="315" y2="110"/>

  <!-- Projections -->
  <rect class="light" x="600" y="60" width="140" height="40"/>
  <text x="610" y="85" class="small">Projection (text)</text>

  <rect class="light" x="600" y="120" width="140" height="40"/>
  <text x="610" y="145" class="small">Projection (image)</text>

  <line class="arrow" x1="560" y1="95" x2="595" y2="80"/>
  <line class="arrow" x1="560" y1="125" x2="595" y2="140"/>

  <!-- Fusion and classifier -->
  <rect class="box" x="780" y="80" width="140" height="60"/>
  <text x="795" y="107" class="text">Gated Fusion</text>
  <text x="795" y="126" class="sub">(concat + gate)</text>

  <line class="arrow" x1="740" y1="80" x2="775" y2="105"/>
  <line class="arrow" x1="740" y1="160" x2="775" y2="115"/>

  <rect class="box" x="780" y="170" width="140" height="60"/>
  <text x="795" y="197" class="text">Classifier</text>
  <text x="795" y="216" class="sub">multi‑label (nodes)</text>
  
  <line class="arrow" x1="850" y1="140" x2="850" y2="165"/>

  <!-- Hierarchy panel -->
  <rect class="muted" x="40" y="200" width="540" height="190"/>
  <text x="55" y="225" class="text">Taxonomy & Masks</text>
  <text x="55" y="244" class="small">Adjacency → parent/child masks, depth weights</text>

  <!-- Simple tree -->
  <rect class="light" x="60" y="260" width="140" height="40"/>
  <text x="70" y="285" class="small">Parent A (pᴀ)</text>

  <rect class="light" x="240" y="240" width="140" height="40"/>
  <text x="250" y="265" class="small">Child A1 (pᴀ¹)</text>

  <rect class="light" x="240" y="300" width="140" height="40"/>
  <text x="250" y="325" class="small">Child A2 (pᴀ²)</text>

  <line class="arrow" x1="200" y1="280" x2="240" y2="260"/>
  <line class="arrow" x1="200" y1="280" x2="240" y2="320"/>

  <!-- Loss boxes -->
  <rect class="box" x="420" y="250" width="150" height="40"/>
  <text x="430" y="275" class="small">Base BCE over nodes</text>

  <rect class="box" x="420" y="310" width="150" height="40"/>
  <text x="430" y="335" class="small">Consistency penalty</text>

  <!-- Loss formula hints -->
  <text x="590" y="275" class="small">L = Lᵦᶜᵉ + λ · Lᶜᵒⁿˢ</text>
  <text x="590" y="335" class="small">Lᶜᵒⁿˢ penalizes p(child) ≫ p(parent)</text>

  <!-- Legend dots -->
  <circle cx="25" cy="72" r="5" class="accent"/>
  <text x="36" y="76" class="small">Text/Image encoders & projections</text>

  <circle cx="25" cy="92" r="5" class="accent2"/>
  <text x="36" y="96" class="small">Hierarchy‑aware loss components</text>
</svg>

